<!DOCTYPE html>
<html>
  <head>
    <title>URL Status Reporter</title>
    <script src="popup.js"></script>
    <style>
      body {
        width: 300px;
        padding: 20px;
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
      }
      h3 {
        color: #333333;
        margin-bottom: 10px;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      input[type="radio"] {
        margin-right: 10px;
      }
      button {
        display: block;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: #0078d4;
        color: white;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h3>Select URL Status:</h3>
    <label>
      <input type="radio" name="status" value="legitimate" checked> Legitimate
    </label>
    <label>
      <input type="radio" name="status" value="phishing"> Phishing
    </label>
    <button id="submitBtn">Submit</button>
  </body>
</html>
